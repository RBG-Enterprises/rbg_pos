# PostgreSQL. Versions 9.1 and up are supported.
#
# Single physical database for all roles (primary + Solid Queue/Cache/Cable).
# The queue/cache/cable roles share the same database; their tables live in
# db/queue_schema.rb, db/cache_schema.rb and db/cable_schema.rb and are
# created by `bin/rails db:prepare` (NOT by `bin/rails db:schema:load`,
# which only loads the primary schema).
#
# Production credentials below are legacy defaults kept for Mina deploys;
# prefer DATABASE_URL (see commented production url entry).
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # http://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  primary:
    <<: *default
    database: rbg_pos_development
  queue:
    <<: *default
    database: rbg_pos_development
  cache:
    <<: *default
    database: rbg_pos_development
  cable:
    <<: *default
    database: rbg_pos_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    database: rbg_pos_test
  queue:
    <<: *default
    database: rbg_pos_test
  cache:
    <<: *default
    database: rbg_pos_test
  cable:
    <<: *default
    database: rbg_pos_test

# As with config/secrets.yml, you never want to store sensitive information,
# like your database password, in your source code. If your source code is
# ever seen by anyone, they now have access to your database.
#
# Instead, provide the password as a unix environment variable when you boot
# the app. Read http://guides.rubyonrails.org/configuring.html#configuring-a-database
# for a full rundown on how to provide these environment variables in a
# production deployment.
#
# On Heroku and other platform providers, you may have a full connection URL
# available as an environment variable. For example:
#
#   DATABASE_URL="postgres://myuser:mypass@localhost/somedatabase"
#
# You can use this database configuration with:
#
#   production:
#     url: <%= ENV['DATABASE_URL'] %>
#
production:
  primary:
    <<: *default
    database: rbg_production
    username: deploy
    password: deploy@rbg
  queue:
    <<: *default
    database: rbg_production
    username: deploy
    password: deploy@rbg
  cache:
    <<: *default
    database: rbg_production
    username: deploy
    password: deploy@rbg
  cable:
    <<: *default
    database: rbg_production
    username: deploy
    password: deploy@rbg
